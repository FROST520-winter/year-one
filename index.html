*{

}

body{

color:white;
overflow-y:auto;
overflow-x:hidden;
transition:background 1s ease;
}

.screen{
width:100vw;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:30px;
text-align:center;
position:relative;

.hidden{
display:none;
}

h1{
margin-bottom:15px;
}

input{

padding:12px;
margin:10px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
transition:0.3s;

button:hover{

.chapter{

.troggy{

#moon:hover{

#labContainer{

#scanner{

#scanner:hover{

}

#labText{
margin-top:20px;

line-height:1.8;
white-space:pre-wrap;

#comfortContainer{

#teddy{
font-size:120px;

transition:0.3s;
}

#teddy:hover{
transform:scale(1.08);
}

#comfortText{
margin-top:20px;
font-size:1.1rem;
line-height:1.8;
white-space:pre-wrap;
}
#mirrorContainer{

transition:0.3s;
}

#mirror:hover{
transform:scale(1.08);

font-size:1.1rem;
line-height:1.8;
white-space:pre-wrap;
}
.heart{
position:fixed;
pointer-events:none;
animation:floatHeart linear infinite;
opacity:0.7;
z-index:1;
user-select:none;
}

@keyframes floatHeart{

0%{
transform:
translateY(110vh)
translateX(0px);
}

25%{
transform:
translateY(75vh)
translateX(15px);
}

50%{
transform:
translateY(40vh)
translateX(-15px);
}

75%{
transform:
translateY(0vh)
translateX(10px);
}

100%{
transform:
translateY(-120vh)
translateX(-10px);
}

}

.star{
position:absolute;
pointer-events:none;
animation:twinkle linear infinite;
}

@keyframes twinkle{

0%{
opacity:0.2;
}

50%{
opacity:1;
}

100%{
opacity:0.2;
}

}
.firefly,
.gaming,
.restDecor,
.mirrorDecor,
.comfortDecor{

position:fixed;
pointer-events:none;
opacity:0.7;
animation:floatHeart linear infinite;
z-index:1;

}

</style>

function login(){

const user =
document.getElementById("username")
.value
.toLowerCase()
.trim();

const pass =
document.getElementById("password")
.value
.toLowerCase()
.trim();

const validUsers = [
"troy",
"shahariar",
"shahariar kabir troy"
];

if(
validUsers.includes(user)
&&
pass === "19 june"
){

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("chapterScreen")
.classList.remove("hidden");

loadChapter();

}else{

document
.getElementById("error")
.innerText =
"ACCESS DENIED. THIS IS NOT YOUR STORY.";

}
}

function loadChapter(){

const chapter =
chapters[currentChapter];
document.getElementById("progress").innerText =
`Chapter ${currentChapter + 1} / ${chapters.length}`;

moonStep = 0;
labStep = 0;
comfortStep = 0;
mirrorStep = 0;
document.getElementById("teddy").innerText = "🧸";
document.getElementById("mirror").innerText = "🪞";
document.body.style.background =
chapter.theme;
if(chapter.title === "50 Reasons Why I Love You"){

document.body.style.color = "#A00000";

}
else{

document.body.style.color = "white";

}
document.getElementById(
"chapterTitle"
).innerText =
chapter.title;

document.getElementById(
"chapterContent"
).innerText =
chapter.content;

document.getElementById(
